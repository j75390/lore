<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Cinzel:wght@600;700&display=swap">
<style>
/* LORE: 캐릭터 그림이 화면을 채우는 어두운 전시장. 그림이 주인공이라 바탕은 먹색, 강조색은 호박빛 하나.
   위: 로고·검색 / 왼쪽: 아이콘 레일(휴대폰에서는 아래 탭) / 가운데: 화면 */
:root{
  --bg:#0f0d11; --bg2:#151218; --panel:#1c1820; --panel2:#262029; --line:#2e2832;
  --ink:#f1ebe6; --muted:#a59ca6; --faint:#6e6571; --accent:#f2b366; --accent2:#ff8f6b; --good:#7fd19b; --bad:#ff7a7a; --warn:#f2c94c;
  --me:#3a2f45;
  --font-body:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;
  --font-story:"Gowun Batang","Batang",serif;
  --font-mono:"JetBrains Mono",Consolas,monospace;
  --font-logo:"Cinzel","Gowun Batang",serif;
  --top:60px; --railw:76px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font-body)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
img{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 상단 바 */
.top{position:fixed;inset:0 0 auto 0;height:var(--top);display:flex;align-items:center;gap:16px;padding:0 20px;background:rgba(15,13,17,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:30}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo svg{width:26px;height:26px}
.logo b{font:700 22px var(--font-logo);letter-spacing:.22em}
.search{flex:1;max-width:520px;margin-left:24px;position:relative}
.search input{width:100%;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--panel);padding:0 16px 0 40px;color:var(--ink)}
.search svg{position:absolute;left:14px;top:11px;width:16px;height:16px;color:var(--faint)}
.top .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 14px;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#24180b;font-weight:700}
.btn.ghost{background:transparent}
.btn.lg{padding:12px 22px;font-size:16px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* 왼쪽 레일 */
.rail{position:fixed;top:var(--top);bottom:0;left:0;width:var(--railw);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;border-right:1px solid var(--line);background:var(--bg);z-index:20}
.rail a{width:58px;padding:9px 0 7px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);text-decoration:none;font-size:11px}
.rail a svg{width:22px;height:22px}
.rail a:hover{color:var(--ink);background:var(--panel)}
.rail a[aria-current="page"]{color:var(--accent);background:var(--panel)}
main{padding:var(--top) 0 0 var(--railw);min-height:100%}
.wrap{max-width:1180px;margin:0 auto;padding:22px 28px 56px}

/* 히어로 배너 */
.hero{position:relative;height:340px;border-radius:22px;overflow:hidden;background:var(--panel)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .7s;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide img{width:100%;height:100%;object-fit:cover}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,8,12,.92) 0%,rgba(10,8,12,.6) 40%,rgba(10,8,12,0) 75%)}
.slide .cap{position:absolute;left:44px;bottom:40px;max-width:480px;z-index:1}
.slide .kick{display:inline-block;font:600 12px var(--font-body);letter-spacing:.12em;color:var(--accent);margin-bottom:10px}
.slide h2{font:700 32px/1.3 var(--font-story);margin:0 0 10px;text-wrap:balance}
.slide p{margin:0 0 18px;color:#d8cfd6}
.hero .nav{position:absolute;bottom:14px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;z-index:2;display:grid;place-items:center;font-size:18px}
.hero .prev{right:58px}.hero .next{right:18px}
.dots{position:absolute;right:104px;bottom:27px;display:flex;gap:6px;z-index:2}
.slide img.tall{object-position:center 22%}
.dots button{width:8px;height:8px;border-radius:99px;border:0;padding:0;background:rgba(255,255,255,.35);transition:width .3s}
.dots button[aria-current="true"]{width:22px;background:var(--accent)}

/* 탭 */
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:26px 0 18px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:10px 0;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.pill{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:6px 14px;font-size:13px}
.pill[aria-pressed="true"]{background:var(--accent2);border-color:var(--accent2);color:#2a0f08;font-weight:700}
.pills .note{margin-left:auto;color:var(--faint);font-size:12px}

/* 섹션·가로 줄 */
.sec{margin-top:34px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sec-h h3{margin:0;font:700 19px var(--font-story)}
.sec-h p{margin:0;color:var(--faint);font-size:13px}
.sec-h a{margin-left:auto;color:var(--muted);font-size:13px;text-decoration:none}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:176px;gap:14px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.row > *{scroll-snap-align:start}

/* 캐릭터 카드(그림 위주) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:22px 16px}
.card{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;min-width:0}
.thumb{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--panel)}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.card:hover .thumb img{transform:scale(1.05)}
.thumb::after{content:"";position:absolute;inset:55% 0 0 0;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.thumb .rank{position:absolute;left:10px;bottom:4px;font:700 40px/1 var(--font-logo);color:#fff;z-index:1;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.thumb .st{position:absolute;right:8px;bottom:8px;z-index:1;display:flex;gap:6px;font:600 11px var(--font-mono);color:#fff}
.thumb .st span{background:rgba(0,0,0,.55);border-radius:6px;padding:2px 6px;display:inline-flex;gap:3px;align-items:center}
.thumb .badge-top{position:absolute;left:0;top:0;z-index:1;font:700 11px var(--font-body);padding:4px 9px;border-bottom-right-radius:10px;background:var(--accent);color:#24180b}
.thumb .heart{position:absolute;right:8px;top:8px;z-index:1;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;color:#fff}
.thumb .heart.on{color:var(--accent2)}
.noimg{width:100%;height:100%;display:grid;place-items:center;font:700 64px var(--font-story);color:rgba(0,0,0,.55)}
.card h4{margin:4px 0 0;font:700 15px/1.4 var(--font-body);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card .nm{color:var(--accent);font-size:12px;font-weight:700}
.card .ds{color:var(--muted);font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hashes{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--accent2);overflow:hidden;max-height:1.6em}
.by{font-size:11px;color:var(--faint)}
.new-card .thumb{border:1.5px dashed var(--line);background:transparent;display:grid;place-items:center;text-align:center;color:var(--muted);padding:12px}
.new-card .thumb::after{display:none}
.new-card b{display:block;font:700 30px var(--font-logo);color:var(--accent)}

/* 이어서 대화하기 */
.cont{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.cc{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-decoration:none}
.cc:hover{border-color:var(--accent)}
.cc .t{font-weight:700}
.cc .p{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc time{color:var(--faint);font-size:11px;align-self:start}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center;font:700 15px var(--font-story);color:#1a1418;overflow:hidden}
.av.md{width:44px;height:44px}
.av.lg{width:56px;height:56px;border-radius:14px;font-size:22px}
.empty{color:var(--faint);padding:30px 0;text-align:center}

/* 캐릭터 상세 */
.detail{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:40px;align-items:start}
.detail .thumb{border-radius:20px}
.detail .thumb::after{display:none}
.detail > .thumb{position:sticky;top:calc(var(--top) + 20px)}
.d-kick{color:var(--accent);font-weight:700;font-size:14px}
.detail h1{font:700 34px/1.3 var(--font-story);margin:4px 0 8px;text-wrap:balance}
.detail .tl{color:#d8cfd6;font-size:16px}
.d-stats{display:flex;gap:18px;margin:18px 0;color:var(--muted);font-size:14px}
.d-stats b{color:var(--ink);font-family:var(--font-mono)}
.d-act{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.like{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 16px;display:inline-flex;gap:6px;align-items:center}
.like[aria-pressed="true"]{color:var(--accent2);border-color:var(--accent2)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.box h3{margin:0 0 8px;font-size:13px;color:var(--faint);font-weight:500;letter-spacing:.04em}
.box .gr{font:16px/1.8 var(--font-story);white-space:pre-wrap}
.gr em,.bubble em{font-style:normal;color:var(--muted);font-size:.95em}

/* 대화 */
.chat{position:fixed;top:var(--top);bottom:0;left:var(--railw);right:0;display:flex;flex-direction:column;background:var(--bg)}
.chat-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;filter:blur(28px) brightness(.32) saturate(1.2);transform:scale(1.15);pointer-events:none}
.chat > *:not(.chat-bg){position:relative}
.chead{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(15,13,17,.55);backdrop-filter:blur(10px)}
.chead a{text-decoration:none}
.chead .n{font:700 17px var(--font-story)}
.chead .s{color:var(--muted);font-size:12px}
.chead .sp{flex:1}
.msgs{flex:1;overflow:auto;padding:28px 20px;display:flex;flex-direction:column;gap:18px}
.intro{max-width:760px;margin:0 auto 6px;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.intro img,.intro .noimg{width:120px;height:160px;border-radius:14px;object-fit:cover;font-size:40px}
.intro b{font:700 20px var(--font-story)}
.intro span{color:var(--muted);font-size:13px}
.msg{display:flex;gap:10px;max-width:760px;width:100%;margin:0 auto}
.msg.me{justify-content:flex-end}
.msg .who{font-size:12px;color:var(--muted);margin-bottom:3px}
.bubble{max-width:min(620px,85%);padding:11px 15px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
.msg.ai .bubble{background:rgba(28,24,32,.88);border:1px solid var(--line);border-top-left-radius:4px;font:16px/1.75 var(--font-story);max-width:100%}
.msg.me .bubble{background:var(--me);border-top-right-radius:4px}
.msg.me .bubble em{color:#cbbfd6}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;color:var(--faint);font:11px var(--font-mono)}
.badge{border-radius:6px;padding:1px 6px;background:var(--panel2)}
.badge.fb{color:var(--warn);background:#3a3220}
.linkbtn{border:0;background:none;color:var(--muted);font:12px var(--font-body);padding:2px 4px;border-radius:6px;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}
.partial{opacity:.6}
.notice{max-width:760px;margin:0 auto;width:100%;border:1px solid #5a3236;background:#2b1d20;border-radius:12px;padding:10px 14px;font-size:14px;color:#ffd6d6;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:4px;animation:b 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.composer{padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(15,13,17,.7);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.06)}
.composer form{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:none;min-height:46px;max-height:180px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 14px;line-height:1.5}
.hint{max-width:760px;margin:6px auto 0;color:var(--faint);font-size:11px;display:flex;gap:12px;flex-wrap:wrap}
.memo{max-width:760px;margin:0 auto;width:100%;background:rgba(38,32,41,.92);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted);white-space:pre-wrap}

/* 대화 목록 */
.clist{display:flex;flex-direction:column;gap:8px}
.clist .cc{grid-template-columns:56px minmax(0,1fr) auto auto}
.x{border:0;background:none;color:var(--faint);padding:6px 8px;border-radius:8px}
.x:hover{color:var(--bad);background:var(--panel2)}

/* 만들기 */
.page-h h1{font:700 28px var(--font-story);margin:0}
.page-h p{color:var(--muted);margin:6px 0 0}
.form{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:32px;margin-top:22px}
.fields{display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
label small{color:var(--faint)}
input[type=text],textarea.f{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink)}
textarea.f{min-height:90px;resize:vertical}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.upl{display:flex;gap:10px;align-items:center}
.err-text{color:var(--bad);font-size:13px;min-height:1.2em;margin:0}

/* 서버 상태 */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:18px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.pcard h3{margin:0;display:flex;align-items:center;gap:8px;font-size:16px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint)}
.dot.up{background:var(--good)}.dot.down{background:var(--bad)}.dot.warn{background:var(--warn)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:0}
.kv dt{color:var(--faint)}.kv dd{margin:0;font-family:var(--font-mono)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:5px 10px;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#2b1012}
.seg button[data-mode="none"][aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#0f2a18}
.tbl{overflow-x:auto;margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--faint);font-weight:500}
td.mono{font-family:var(--font-mono)}
.ok{color:var(--good)}.no{color:var(--bad)}

@media (max-width:860px){
  :root{--railw:0px;--top:56px}
  .rail{top:auto;bottom:0;left:0;right:0;width:auto;height:calc(60px + env(safe-area-inset-bottom,0px));flex-direction:row;justify-content:space-around;padding:4px 8px env(safe-area-inset-bottom,0px);border-right:0;border-top:1px solid var(--line);background:rgba(15,13,17,.95)}
  main{padding-bottom:70px}
  .chat{bottom:calc(60px + env(safe-area-inset-bottom,0px))}
  .top{padding:0 16px;gap:10px}
  .search{margin-left:4px}
  .top .make{display:none}
  .wrap{padding:16px 16px 40px}
  .hero{height:300px;border-radius:16px}
  .slide::after{background:linear-gradient(0deg,rgba(10,8,12,.95) 0%,rgba(10,8,12,.5) 50%,rgba(10,8,12,0) 80%)}
  .slide .cap{left:20px;right:20px;bottom:30px}
  .slide h2{font-size:23px}
  .slide p{display:none}
  .hero .nav{display:none}
  .dots{top:16px;bottom:auto;right:16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
  .row{grid-auto-columns:140px}
  .detail{grid-template-columns:minmax(0,1fr);gap:20px}
  .detail .thumb{max-width:320px;margin:0 auto;width:100%;position:static}
  .form{grid-template-columns:minmax(0,1fr)}
  .msgs,.composer,.chead{padding-left:12px;padding-right:12px}
  .hint span:last-child{display:none}
}
@media (max-width:480px){.logo b{font-size:18px}.chead .s{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 서버 꺼짐 안내 */
.offline{position:fixed;left:0;right:0;top:var(--top);z-index:25;background:#3a3220;color:#f6e3b0;font-size:13px;padding:8px 20px;text-align:center}
body.is-offline main{padding-top:calc(var(--top) + 36px)}
body.is-offline .chat{top:calc(var(--top) + 36px)}
/* 회원 */
.top .userbox{display:flex;gap:8px;align-items:center}
.ubtn{display:flex;gap:8px;align-items:center;text-decoration:none;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.uname{font-size:14px;font-weight:500;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,var(--accent),var(--accent2));color:#24180b;font:700 28px var(--font-story);flex:none}
.me-av.sm{width:30px;height:30px;font-size:14px}
.owner-badge{font-size:11px;color:var(--good);border:1px solid #2f5a3d;background:#16251b;border-radius:999px;padding:3px 9px;white-space:nowrap}
.auth-wrap{display:flex;justify-content:center}
.auth{width:100%;max-width:440px;padding:20px 0 40px}
.auth-logo{display:block;text-align:center;font:700 26px var(--font-logo);letter-spacing:.22em;text-decoration:none;color:var(--accent);margin-bottom:18px}
.auth h1{font:700 26px var(--font-story);text-align:center;margin:0}
.auth .sub{color:var(--muted);text-align:center;margin:6px 0 22px}
.auth-form{display:flex;flex-direction:column;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.auth-form.wide{max-width:560px}
.auth-form h3{margin:0;font-size:16px}
.auth-form input[type=email],.auth-form input[type=password],.auth-form input[type=text],.auth-form select{width:100%;height:44px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:0 12px;color:var(--ink)}
.auth-form input:disabled{opacity:.6}
.pw{position:relative;display:block}
.pw input{padding-right:64px!important}
.eye{position:absolute;right:6px;top:6px;height:32px;border:0;background:var(--panel2);border-radius:8px;color:var(--muted);font-size:12px;padding:0 10px}
.row2{display:flex;gap:8px}.row2 input{flex:1}
.meter{display:block;height:4px;background:var(--panel2);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--bad);transition:width .2s}
.meter i[data-s="3"]{background:var(--warn)}.meter i[data-s="4"],.meter i[data-s="5"]{background:var(--good)}
.ok-text{color:var(--good);font-size:13px;margin:0}
.block{width:100%;display:flex}
.terms{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0;display:flex;flex-direction:column;gap:2px}
.terms legend{font-size:13px;color:var(--muted);padding:0 4px}
.ck{flex-direction:row!important;align-items:center;gap:10px!important;color:var(--ink)!important;font-size:14px!important;padding:6px 0}
.ck input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.ck span{flex:1}.ck small{display:block;color:var(--faint);font-size:12px}
.ck a{color:var(--faint);font-size:12px}
.ck.all{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px}
.auth-links{display:flex;gap:10px;justify-content:center;margin-top:16px;color:var(--faint);font-size:14px}
.auth-links a{color:var(--accent)}
.auth-note{color:var(--faint);font-size:13px;text-align:center;margin-top:14px}
.welcome{text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 20px;margin-bottom:14px}
.welcome .big{font-size:40px;color:var(--accent)}
.me-head{display:flex;gap:18px;align-items:center;margin-bottom:20px}
.me-head h1{font:700 26px var(--font-story);margin:0}
.me-head p{margin:2px 0 0;color:var(--muted);font-size:14px}.me-head .bio{color:var(--ink)}
.me-stats{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px}
.me-stats > a,.quota{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:2px}
.me-stats > a b{font:700 22px var(--font-mono);color:var(--ink)}
.quota .q-h{display:flex;justify-content:space-between;align-items:baseline}.quota b{color:var(--ink);font:700 18px var(--font-mono)}
.quota .bar{height:8px;background:var(--panel2);border-radius:8px;overflow:hidden;margin:8px 0 4px}
.quota .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.quota small{color:var(--faint)}
.preview-chat{background:var(--bg2);border-radius:12px;padding:12px}
.preview-chat .who{font-size:12px;color:var(--muted)}.preview-chat .bubble{background:var(--panel);border:1px solid var(--line);font:15px/1.7 var(--font-story);margin-top:4px;max-width:100%}
.danger-zone{max-width:560px;border:1px solid var(--line);border-radius:18px;padding:18px 22px;margin-top:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.danger-zone h3{margin:0;font-size:16px}.danger-zone p{margin:0;color:var(--muted);font-size:14px}
.danger-zone label{width:100%}.danger-zone input{width:100%;height:42px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:0 12px;color:var(--ink)}
.danger-zone.red{border-color:#5a3236}
.btn.danger{background:#5a2328;border-color:#7a2f35;color:#ffd6d6}
.toast{position:fixed;left:50%;bottom:90px;translate:-50% 20px;opacity:0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;z-index:50;transition:.25s;pointer-events:none}
.toast.on{opacity:1;translate:-50% 0}
.doc h3{font:700 17px var(--font-story);margin:22px 0 6px}.doc p{color:#d8cfd6;margin:0}
.foot{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);color:var(--faint);font-size:12px;display:flex;gap:14px;flex-wrap:wrap}
.foot a{color:var(--muted)}
.quota-hint b{color:var(--accent)}
@media (max-width:860px){.me-stats{grid-template-columns:repeat(2,1fr)}.quota{grid-column:1/-1}.uname{display:none}.top .userbox .btn{padding:7px 10px;font-size:13px}.owner-badge{display:none}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="#home" aria-label="LORE 홈">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 5h14l6 6v16H6z" fill="none" stroke="#f2b366" stroke-width="2"/><path d="M10 13h12M10 18h12M10 23h7" stroke="#ff8f6b" stroke-width="2" stroke-linecap="round"/></svg>
    <b>LORE</b>
  </a>
  <form class="search" id="searchForm" role="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <label class="sr" for="q">캐릭터 검색</label>
    <input id="q" type="search" placeholder="이름, 이야기, 태그로 찾기" autocomplete="off">
  </form>
  <span class="sp"></span>
  <a class="btn primary make" href="#create">+ 캐릭터 만들기</a>
  <div class="userbox" id="userbox"></div>
</header>
<nav class="rail" aria-label="주 메뉴">
  <a href="#home" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>홈</a>
  <a href="#ranking" data-nav="ranking"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>랭킹</a>
  <a href="#chats" data-nav="chats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H9l-5 4z"/></svg>대화</a>
  <a href="#create" data-nav="create"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>만들기</a>
  <a href="#status" data-nav="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>서버</a>
</nav>
<main id="main"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// *지문*은 흐린 글씨로. 나머지는 그대로(HTML은 이스케이프)
const story = (s) => esc(s).replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
const plain = (s) => String(s ?? '').replace(/\*/g, '');
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()).replace(/-/g, '').slice(0, 20);
const num = (n) => (n >= 10000 ? (n / 10000).toFixed(1) + '만' : n >= 1000 ? (n / 1000).toFixed(1) + '천' : String(n));
const ago = (ts) => {
  const d = new Date(ts.replace(' ', 'T') + 'Z'), s = (Date.now() - d) / 1000;
  return s < 60 ? '방금' : s < 3600 ? `${Math.floor(s / 60)}분 전` : s < 86400 ? `${Math.floor(s / 3600)}시간 전` : `${Math.floor(s / 86400)}일 전`;
};
// 공개 화면(GitHub Pages)에서는 api.json이 지금 켜진 서버 주소를 알려 준다. PC 서버에서 직접 열면 같은 주소를 쓴다.
let API_BASE = '', OFFLINE = false, SNAPSHOT = [];
const withBase = (u) => (u && u.startsWith('/media/') ? API_BASE + u : u);
async function initBase() {
  let cfg = null;
  try { const r = await fetch('api.json', { cache: 'no-store' }); if (r.ok) cfg = await r.json(); } catch {}
  if (!cfg) return;                                   // PC 서버에서 직접 연 경우
  API_BASE = (cfg.api || '').replace(/\/$/, '');
  let alive = false;
  if (API_BASE) {
    try {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 7000);
      alive = (await fetch(API_BASE + '/api/config', { signal: ctl.signal })).ok; clearTimeout(t);
    } catch {}
  }
  if (!alive) {
    OFFLINE = true;
    try { SNAPSHOT = await (await fetch('characters.json', { cache: 'no-store' })).json(); } catch {}
    const b = document.createElement('div'); b.className = 'offline';
    b.innerHTML = '<b>지금은 서버 PC가 쉬는 중이에요.</b> 캐릭터 구경은 할 수 있고, 대화·로그인은 PC가 켜지면 다시 돼요.';
    document.body.prepend(b); document.body.classList.add('is-offline');
  }
}
function offlineApi(path) {
  const u = new URL(path, location.origin);
  if (u.pathname === '/api/characters') return SNAPSHOT;
  const m = u.pathname.match(/^\/api\/characters\/([^/]+)$/);
  if (m) { const c = SNAPSHOT.find((x) => x.id === decodeURIComponent(m[1])); if (c) return { ...c, conversations: [] }; }
  if (u.pathname === '/api/me') return { member: false, admin: false, owner: null, usage: null };
  if (u.pathname === '/api/conversations') return [];
  if (u.pathname === '/api/config') return { auth: false };
  throw new Error('지금은 서버 PC가 쉬는 중이라 할 수 없어요. PC가 켜지면 다시 해 주세요.');
}
async function api(path, opts = {}) {
  if (OFFLINE) return offlineApi(path);
  const r = await fetch(API_BASE + path, { ...opts, headers: await authHeaders() });
  if (!r.ok) { let m = r.statusText; try { const j = await r.json(); m = j.detail?.[0]?.msg || j.detail || m; } catch {} throw new Error(m); }
  return r.status === 204 ? null : r.json();
}
const PROVIDER_LABEL = { primary: '주 모델', backup: '예비 모델', greeting: '첫 인사' };
const ICON = {
  chat: '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16v12H9l-5 4z"/></svg>',
  heart: (on) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="${on ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>`,
};

// 그림이 없으면(내가 만든 캐릭터) 색 바탕에 이름 첫 글자
const pic = (c, cls = '') => c.image
  ? `<img class="${cls}" src="${esc(withBase(c.image))}" alt="" loading="lazy">`
  : `<span class="noimg ${cls}" style="background:linear-gradient(160deg,${esc(c.color)},#1c1820)">${esc(c.name.slice(0, 1))}</span>`;
const av = (c, cls = '') => c.image
  ? `<img class="av ${cls}" src="${esc(withBase(c.image))}" alt="">`
  : `<span class="av ${cls}" style="background:${esc(c.color)}" aria-hidden="true">${esc(c.name.slice(0, 1))}</span>`;
const by = (c) => (c.creator === 'user' ? '내가 만든 캐릭터' : 'LORE 오리지널');

function card(c, { rank } = {}) {
  const s = c.stats || { messages: 0, liked: false };
  return `<a class="card" href="#c-${esc(c.id)}">
    <div class="thumb">${pic(c)}
      ${c.creator === 'user' ? '<span class="badge-top">MY</span>' : ''}
      ${s.liked ? `<span class="heart on" aria-label="찜함">${ICON.heart(true)}</span>` : ''}
      ${rank ? `<span class="rank">${rank}</span>` : ''}
      <span class="st"><span title="내가 보낸 메시지">${ICON.chat}${num(s.messages)}</span></span>
    </div>
    <h4>${esc(c.title || c.tagline || c.name)}</h4>
    <span class="nm">${esc(c.name)}</span>
    <span class="ds">${esc(c.tagline)}</span>
    <span class="hashes">${c.tags.map((t) => `<span>#${esc(t)}</span>`).join('')}</span>
    <span class="by">${by(c)}</span>
  </a>`;
}
const newCard = () => `<a class="card new-card" href="#create"><div class="thumb"><span><b>+</b>내 캐릭터 만들기<br><small style="color:var(--faint)">성격과 말투만 정하면 바로 대화</small></span></div></a>`;

let statusTimer = null, heroTimer = null;

// ---------- 홈 ----------
const SECTIONS = [
  ['미스터리를 같이 푸는 사이', '단서를 보고 추리하면 이야기가 움직여요', ['추리', '미스터리', '스릴러']],
  ['다른 세계로 떠나기', '판타지·SF·시대극', ['판타지', 'SF', '시대극']],
  ['오늘 하루 끝에 들르는 곳', '일상과 힐링', ['일상', '힐링']],
  ['웃다 보면 시간 가는', '티키타카가 좋은 캐릭터', ['코미디', '장난', '엉뚱']],
];
async function viewHome() {
  const [chars, convs] = await Promise.all([api('/api/characters?period=week'), api('/api/conversations')]);
  const featured = [...chars.filter((c) => c.banner), ...chars.filter((c) => !c.banner && c.image)].slice(0, 5);
  const popular = [...chars].sort((a, b) => b.stats.messages - a.stats.messages || b.stats.conversations - a.stats.conversations);
  const liked = chars.filter((c) => c.stats.liked);
  const mine = chars.filter((c) => c.creator === 'user');
  const seen = new Set();
  const latestConvs = convs.filter((v) => !seen.has(v.character.id) && seen.add(v.character.id)).slice(0, 4);
  $('#main').innerHTML = `<div class="wrap">
    ${featured.length ? `<section class="hero" aria-roledescription="carousel" aria-label="추천 이야기">
      ${featured.map((c, i) => `<div class="slide${i ? '' : ' on'}" aria-hidden="${i ? 'true' : 'false'}">
        <img src="${esc(c.banner || c.image)}" class="${c.banner ? '' : 'tall'}" alt="" ${i ? 'loading="lazy"' : ''}>
        <div class="cap"><span class="kick">${esc(c.name)} · ${c.tags.map((t) => '#' + esc(t)).join(' ')}</span>
          <h2>${esc(c.title || c.tagline)}</h2><p>${esc(c.tagline)}</p>
          <a class="btn primary lg" href="#c-${esc(c.id)}" tabindex="${i ? -1 : 0}">이야기 보기</a></div></div>`).join('')}
      ${featured.length > 1 ? `<button class="nav prev" aria-label="이전">‹</button><button class="nav next" aria-label="다음">›</button>
      <div class="dots">${featured.map((_, i) => `<button aria-label="${i + 1}번째" aria-current="${!i}"></button>`).join('')}</div>` : ''}
    </section>` : ''}
    ${latestConvs.length ? `<section class="sec"><div class="sec-h"><h3>이어서 대화하기</h3><a href="#chats">전체 보기 ›</a></div>
      <div class="cont">${latestConvs.map((v) => convCard(v)).join('')}</div></section>` : ''}
    <section class="sec"><div class="sec-h"><h3>이번 주 많이 이야기한</h3><p>내가 보낸 메시지 수 기준</p><a href="#ranking">랭킹 ›</a></div>
      <div class="row">${popular.slice(0, 10).map((c, i) => card(c, { rank: i + 1 })).join('')}</div></section>
    ${liked.length ? `<section class="sec"><div class="sec-h"><h3>찜한 캐릭터</h3></div><div class="row">${liked.map((c) => card(c)).join('')}</div></section>` : ''}
    ${SECTIONS.map(([h, p, tags]) => {
      const list = chars.filter((c) => c.tags.some((t) => tags.includes(t)));
      return list.length ? `<section class="sec"><div class="sec-h"><h3>${h}</h3><p>${p}</p><a href="#tag-${encodeURIComponent(tags[0])}">더 보기 ›</a></div><div class="row">${list.map((c) => card(c)).join('')}</div></section>` : '';
    }).join('')}
    <section class="sec"><div class="sec-h"><h3>내가 만든 캐릭터</h3><a href="#create">새로 만들기 ›</a></div>
      <div class="row">${mine.map((c) => card(c)).join('')}${newCard()}</div></section>
    <footer class="foot"><span>LORE · 개인 포트폴리오 서비스</span><a href="#terms">이용약관</a><a href="#privacy"><b>개인정보 처리방침</b></a><a href="#status">서버 상태</a><span>캐릭터 답은 AI가 만든 허구예요</span></footer>
  </div>`;
  startHero(featured.length);
}
function startHero(n) {
  clearInterval(heroTimer);
  if (n < 2) return;
  let i = 0;
  const go = (k) => {
    i = (k + n) % n;
    $$('.slide').forEach((s, j) => { s.classList.toggle('on', j === i); s.setAttribute('aria-hidden', String(j !== i)); s.querySelector('a').tabIndex = j === i ? 0 : -1; });
    $$('.dots button').forEach((d, j) => d.setAttribute('aria-current', String(j === i)));
  };
  $('.hero .prev').onclick = () => { go(i - 1); restart(); };
  $('.hero .next').onclick = () => { go(i + 1); restart(); };
  $$('.dots button').forEach((d, j) => (d.onclick = () => { go(j); restart(); }));
  const restart = () => { clearInterval(heroTimer); if (!matchMedia('(prefers-reduced-motion: reduce)').matches) heroTimer = setInterval(() => { if (!$('.hero')) return clearInterval(heroTimer); go(i + 1); }, 6000); };
  restart();
}
function convCard(v, withDelete = false) {
  return `<a class="cc" href="#chat-${esc(v.id)}">${av(v.character, 'lg')}
    <span style="min-width:0"><span class="t">${esc(v.character.name)}</span><span class="p" style="display:block;color:var(--faint);font-size:12px">${esc(v.character.title || '')}</span>
    <span class="p" style="display:block">${esc(plain(v.last_message))}</span></span>
    <time>${ago(v.updated_at)}</time>
    ${withDelete ? `<button class="x" data-del="${esc(v.id)}" aria-label="${esc(v.character.name)} 대화 삭제">삭제</button>` : ''}</a>`;
}

// ---------- 랭킹 ----------
const PERIOD = { day: '오늘', week: '이번 주', all: '전체' };
async function viewRanking(period = 'day') {
  const chars = await api(`/api/characters?period=${period}`);
  const sorted = [...chars].sort((a, b) => b.stats.messages - a.stats.messages || b.stats.conversations - a.stats.conversations || (b.stats.liked - a.stats.liked));
  $('#main').innerHTML = `<div class="wrap">
    <div class="page-h"><h1>랭킹</h1><p>내가 실제로 보낸 메시지 수로 순위를 매겨요. 같으면 대화방 수, 찜 순서예요.</p></div>
    <nav class="tabs" aria-label="기간">${Object.entries(PERIOD).map(([k, t]) => `<a href="#ranking-${k}" ${k === period ? 'aria-current="page"' : ''}>${t}</a>`).join('')}</nav>
    <div class="grid">${sorted.map((c, i) => card(c, { rank: i + 1 })).join('')}</div></div>`;
}

// ---------- 태그·검색 ----------
async function viewList({ tag = null, q = '' } = {}) {
  const chars = await api('/api/characters?period=all');
  const tags = [...new Set(chars.flatMap((c) => c.tags))];
  const needle = q.trim().toLowerCase();
  const shown = chars.filter((c) => (!tag || c.tags.includes(tag)) &&
    (!needle || [c.name, c.title, c.tagline, ...c.tags].join(' ').toLowerCase().includes(needle)));
  $('#main').innerHTML = `<div class="wrap">
    <div class="page-h"><h1>${needle ? `'${esc(q)}' 검색 결과` : tag ? '#' + esc(tag) : '태그로 찾기'}</h1><p>${shown.length}명의 캐릭터</p></div>
    <div class="pills" style="margin-top:18px">${['전체', ...tags].map((t) => `<a class="pill" href="#tag-${encodeURIComponent(t)}" aria-pressed="${(t === '전체' && !tag) || t === tag}" style="text-decoration:none">#${esc(t)}</a>`).join('')}</div>
    ${shown.length ? `<div class="grid">${shown.map((c) => card(c)).join('')}</div>` : '<p class="empty">찾는 캐릭터가 없어요. 직접 만들어 보는 건 어때요?</p>'}</div>`;
}

// ---------- 캐릭터 상세 ----------
async function viewDetail(id) {
  const c = await api(`/api/characters/${encodeURIComponent(id)}`);
  const s = c.stats;
  $('#main').innerHTML = `<div class="wrap"><div class="detail">
    <div class="thumb">${pic(c)}</div>
    <div>

function metaHTML(m) {
  if (m.role !== 'assistant' || m.provider === 'greeting') return '';
  const bits = [];
  if (m.provider) bits.push(`<span class="badge">${esc(PROVIDER_LABEL[m.provider] || m.provider)}</span>`);
  if (m.ttft != null) bits.push(`<span>첫 글자 ${m.ttft.toFixed(2)}s</span>`);
  if (m.skipped?.length) bits.push(`<span class="badge fb" title="${esc(m.skipped.map((s) => s.provider + ': ' + s.error).join('\n'))}">${esc(m.skipped.map((s) => PROVIDER_LABEL[s.provider] || s.provider).join(', '))} 실패 → 전환</span>`);
  if (m.replay) bits.push('<span class="badge">저장된 답 다시 받음</span>');
  return bits.join('');
}
function renderMsg(m, isLast) {
  const el = document.createElement('div');
  el.className = 'msg ' + (m.role === 'user' ? 'me' : 'ai');
  if (m.role === 'user') { el.innerHTML = `<div class="bubble">${story(m.content)}</div>`; return el; }
  el.innerHTML = `${av(chat.character)}<div style="min-width:0;flex:1"><div class="who">${esc(chat.character.name)}</div><div class="bubble">${story(m.content)}</div>
    <div class="meta">${metaHTML(m)}${isLast && m.provider !== 'greeting' ? '<button class="linkbtn" data-regen>다시 생성</button>' : ''}</div></div>`;
  el.querySelector('[data-regen]')?.addEventListener('click', regenerate);
  return el;
}
function quotaHint() {
  const u = me.usage, el = $('#qh');
  if (!el || !u || u.messages_limit == null) return;
  el.innerHTML = `오늘 남은 대화 <b>${Math.max(0, u.messages_limit - u.messages_used)}</b>/${u.messages_limit}`;
}
function scrollDown() { const m = $('#msgs'); if (m) m.scrollTop = m.scrollHeight; }
function setBusy(b) { chat.busy = b; $('#sendBtn').disabled = b; $$('[data-regen]').forEach((x) => (x.disabled = b)); }

async function send(retry) {
  if (chat.busy) return;
  const input = $('#input');
  const text = retry ? retry.text : input.value.trim();
  if (!text) return;
  const clientMsgId = retry ? retry.id : uid();
  if (!retry) {
    input.value = ''; input.style.height = 'auto';
    $$('[data-regen]').forEach((x) => x.remove());
    $('#msgs').appendChild(renderMsg({ role: 'user', content: text }));
  }
  await streamInto(`/api/conversations/${chat.id}/messages`, { client_msg_id: clientMsgId, text }, { id: clientMsgId, text });
}
async function regenerate() {
  if (chat.busy) return;
  $$('.msg.ai').pop()?.remove();
  await streamInto(`/api/conversations/${chat.id}/regenerate`, {}, null);
}
async function streamInto(url, body, retryInfo) {
  setBusy(true);
  $('.notice')?.remove();
  const holder = document.createElement('div');
  holder.className = 'msg ai';
  holder.innerHTML = `${av(chat.character)}<div style="min-width:0;flex:1"><div class="who">${esc(chat.character.name)}</div><div class="bubble"><span class="typing" aria-label="입력 중"><span></span><span></span><span></span></span></div><div class="meta"></div></div>`;
  $('#msgs').appendChild(holder); scrollDown();
  const bubble = holder.querySelector('.bubble'), meta = holder.querySelector('.meta');
  let text = '', start = null, finished = false;
  const fail = (msg, partial) => {
    if (partial) { bubble.innerHTML = story(partial); bubble.classList.add('partial'); } else holder.remove();
    const n = document.createElement('div'); n.className = 'notice';
    n.innerHTML = `<span>${esc(msg)}</span>`;
    if (retryInfo) { const b = document.createElement('button'); b.className = 'btn'; b.textContent = '같은 메시지로 다시 보내기'; b.onclick = () => { holder.remove(); n.remove(); send(retryInfo); }; n.appendChild(b); }
    $('#msgs').appendChild(n); scrollDown();
  };
  try {
    if (OFFLINE) throw new Error('지금은 서버 PC가 쉬는 중이에요');
    const r = await fetch(API_BASE + url, { method: 'POST', headers: await authHeaders(), body: JSON.stringify(body) });
    if (!r.ok) { let m = r.statusText; try { const j = await r.json(); m = j.detail?.[0]?.msg || j.detail || m; } catch {} throw new Error(m); }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!line.startsWith('data: ')) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === 'start') { start = ev; meta.innerHTML = metaHTML({ role: 'assistant', provider: ev.provider, ttft: ev.ttft, skipped: ev.skipped }); }
        else if (ev.type === 'token') { text += ev.text; bubble.innerHTML = story(text); scrollDown(); }
        else if (ev.type === 'done' || ev.type === 'replay') {
          finished = true;
          const m = { role: 'assistant', content: ev.text, provider: ev.provider, ttft: ev.ttft ?? start?.ttft, skipped: ev.skipped ?? start?.skipped, replay: ev.type === 'replay' };
          holder.replaceWith(renderMsg(m, true));
        } else if (ev.type === 'error') {
          finished = true;
          if (ev.reason === 'mid_stream') fail('답을 쓰는 도중 모델 연결이 끊겼어요. 불완전한 답은 저장하지 않았어요.', ev.partial);
          else if (ev.reason === 'all_failed') fail('지금은 두 모델 모두 응답하지 않아요. 잠시 뒤 다시 보내 주세요.');
          else fail(ev.detail || '보내지 못했어요.');
        }
      }
    }
    if (!finished) fail('연결이 끊겼어요. 서버는 답을 끝까지 만들어 두니, 같은 메시지로 다시 보내면 그 답을 받아요.', text);
  } catch (e) {
    fail(`보내지 못했어요: ${e.message}`, text);
  } finally {
    setBusy(false); scrollDown(); refreshMe().then(quotaHint);
    if (matchMedia('(min-width: 861px)').matches) $('#input')?.focus();
  }
}

const COLORS = ['#f2b366', '#e0565b', '#4fa3e0', '#b07cdf', '#5cbf8a', '#8a8f9e', '#e58fb8', '#d9c35a'];
// 고른 그림을 3:4로 잘라 600×800 JPEG로 줄인다(서버에는 2MB 안쪽만 보낸다)
function shrink(file) {
  return new Promise((ok, bad) => {
    const img = new Image();
    img.onload = () => {
      const W = 600, H = 800, cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      const s = Math.max(W / img.width, H / img.height), w = img.width * s, h = img.height * s;
      cv.getContext('2d').drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
      URL.revokeObjectURL(img.src); ok(cv.toDataURL('image/jpeg', 0.86));
    };
    img.onerror = () => bad(new Error('그림을 읽지 못했어요'));
    img.src = URL.createObjectURL(file);
  });
}

          ${[['none', '정상'], ['down', '연결 실패'], ['slow', `느림(${s.router.first_token_timeout + 4}s)`], ['cut', '도중 끊김']].map(([m, t]) => `<button data-mode="${m}" aria-pressed="${p.fault === m}">${t}</button>`).join('')}
        </div></div></div>`;
    }).join('');
    $('#pgrid').querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', async () => {
      const provider = b.closest('.seg').dataset.p;
      await api('/api/admin/fault', { method: 'POST', body: JSON.stringify({ provider, mode: b.dataset.mode, delay: s.router.first_token_timeout + 4, cut_after: 6 }) });
      refresh();
    }));
    $('#calls').innerHTML = s.recent.map((c) => `<tr><td class="mono">${new Date(c.ts * 1000).toLocaleTimeString('ko-KR')}</td><td>${esc(PROVIDER_LABEL[c.provider] || c.provider)}</td>
      <td class="${c.ok ? 'ok' : 'no'}">${c.ok ? '성공' : '실패'}</td><td class="mono">${c.ttft != null ? c.ttft.toFixed(2) + 's' : '-'}</td><td class="mono">${c.total != null ? c.total.toFixed(2) + 's' : '-'}</td>
      <td class="mono">${c.chars ?? '-'}</td><td>${c.purpose === 'summary' ? '기억 요약' : '대화'}</td><td style="white-space:normal;color:var(--muted)">${esc(c.error || '')}</td></tr>`).join('') || '<tr><td colspan="8" style="color:var(--faint)">아직 호출이 없어요</td></tr>';
  };
  await refresh();
  clearInterval(statusTimer); statusTimer = setInterval(refresh, 3000);
}

// ---------- 회원(Supabase Auth) ----------
// 가입·로그인은 브라우저가 Supabase에 직접 한다. 서버(PC)는 비밀번호를 보지 않고, 토큰으로 누구인지만 확인한다.
const AUTH_ERR = {
  'Invalid login credentials': '이메일 또는 비밀번호가 맞지 않아요.',
  'User already registered': '이미 가입한 이메일이에요. 로그인해 주세요.',
  'Database error saving new user': '가입 조건이 맞지 않아요. 닉네임 중복, 나이(만 14세 이상), 필수 약관 동의를 확인해 주세요.',
  'Password should be at least 8 characters.': '비밀번호는 8자 이상이어야 해요.',
  'New password should be different from the old password.': '지금 비밀번호와 다른 비밀번호를 써 주세요.',
};
const authMsg = (e) => {
  const m = e?.message || String(e);
  if (/at least one character of each/i.test(m) || /weak/i.test(m)) return '비밀번호는 영문과 숫자를 모두 넣어 8자 이상으로 해 주세요.';
  if (/rate limit/i.test(m)) return '요청이 너무 잦아요. 잠시 뒤 다시 시도해 주세요.';
  if (/current password|reauthentication/i.test(m)) return '지금 비밀번호가 맞지 않아요.';
  return AUTH_ERR[m] || m;
};
const PW_OK = (p) => p.length >= 8 && /[A-Za-z]/.test(p) && /\d/.test(p);
const NICK_OK = (n) => /^[가-힣A-Za-z0-9_]{2,12}$/.test(n);
function needLogin(next) {
  try { sessionStorage.setItem('lore_next', next || location.hash); } catch {}
  toast('로그인하면 이어서 할 수 있어요');
  location.hash = '#login';
}
function afterLogin() {
  let next = '#home';
  try { next = sessionStorage.getItem('lore_next') || '#home'; sessionStorage.removeItem('lore_next'); } catch {}
  location.hash = next === '#login' || next === '#signup' ? '#home' : next;
}
function authShell(title, sub, body) {
  return `<div class="wrap auth-wrap"><div class="auth">
    <a class="auth-logo" href="#home">LORE</a>
    <h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}${body}</div></div>`;
}
function fieldErr(id, msg) { const el = $(`#${id}`); if (el) { el.className = 'err-text'; el.textContent = msg || ''; } }

      <p class="err-text" id="lerr" role="alert"></p>
      <button class="btn primary lg block" type="submit">로그인</button>
    </form>
    <div class="auth-links"><a href="#forgot">비밀번호 찾기</a><span aria-hidden="true">·</span><a href="#signup">회원가입</a></div>
    <p class="auth-note">구경은 로그인 없이도 할 수 있어요. 대화·찜·캐릭터 만들기는 회원만 할 수 있어요.</p>`);

    const { error } = await sb.auth.signInWithPassword({ email, password });

      e.preventDefault();
      const nickname = $('#p-nick').value.trim();
      if (!NICK_OK(nickname)) return fieldErr('e-pnick', '2~12자의 한글·영문·숫자·_ 로 적어 주세요.');
      if (nickname.toLowerCase() !== (prof?.nickname || '').toLowerCase()) {
        const { data } = await sb.rpc('nickname_available', { n: nickname });
        if (!data) return fieldErr('e-pnick', '이미 쓰고 있는 닉네임이에요.');
      }
      const { error } = await sb.from('profiles').update({ nickname, bio: $('#p-bio').value.trim(), marketing_opt_in: $('#p-mkt').checked }).eq('id', await uid());
      if (error) return ($('#perr').textContent = /duplicate|unique/i.test(error.message) ? '이미 쓰고 있는 닉네임이에요.' : error.message);
      toast('프로필을 저장했어요'); viewMe('profile');
    });
  } else if (tab === 'persona') {
    body.innerHTML = `<form id="cf2" class="auth-form wide" novalidate>
      <p class="auth-note" style="text-align:left;margin:0 0 6px">캐릭터가 대화 중에 나를 부르는 이름이에요. 바꾸면 <b>새로 시작하는 대화</b>부터 적용돼요.</p>
      <label>캐릭터가 부를 이름 <small>12자까지. 비우면 닉네임</small><input type="text" id="c-call" maxlength="12" value="${esc(prof?.call_name)}"></label>
      <div class="preview-chat"><span class="who">하루</span><div class="bubble"><em>보리차를 내려놓으며</em> <span id="c-prev"></span>님, 오늘 하루는 어땠어요?</div></div>
      <p class="err-text" id="cerr" role="alert"></p><button class="btn primary lg" type="submit">저장</button></form>`;
    const upd = () => ($('#c-prev').textContent = $('#c-call').value.trim() || prof?.nickname || '');
    $('#c-call').addEventListener('input', upd); upd();
    $('#cf2').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { error } = await sb.from('profiles').update({ call_name: $('#c-call').value.trim() }).eq('id', await uid());
      if (error) return ($('#cerr').textContent = error.message);
      toast('대화 프로필을 저장했어요'); viewMe('persona');
    });
  } else {
    body.innerHTML = `<form id="pwf" class="auth-form wide" novalidate><h3>비밀번호 바꾸기</h3>
      <label>지금 비밀번호<input type="password" id="a-cur" autocomplete="current-password"></label>
      <label>새 비밀번호 <small>영문과 숫자를 섞어 8자 이상</small><input type="password" id="a-new" autocomplete="new-password"></label>
      <label>새 비밀번호 확인<input type="password" id="a-new2" autocomplete="new-password"></label>
      <p class="err-text" id="aerr" role="alert"></p><button class="btn primary" type="submit">바꾸기</button></form>
      <div class="danger-zone"><h3>로그아웃</h3><p>이 브라우저에서 로그아웃해요.</p><button class="btn" id="logoutBtn">로그아웃</button></div>
      <div class="danger-zone red"><h3>회원 탈퇴</h3>
        <p>탈퇴하면 <b>대화 기록, 찜, 내가 만든 캐릭터와 그림, 계정</b>이 모두 지워지고 되돌릴 수 없어요.</p>
        <label>확인을 위해 <b>탈퇴</b>라고 적어 주세요<input type="text" id="d-confirm" autocomplete="off"></label>
        <p class="err-text" id="derr" role="alert"></p><button class="btn danger" id="delBtn" disabled>회원 탈퇴</button></div>`;
    $('#pwf').addEventListener('submit', async (e) => {
      e.preventDefault();
      const cur = $('#a-cur').value, p = $('#a-new').value;
      if (!cur) return ($('#aerr').textContent = '지금 비밀번호를 적어 주세요.');
      if (!PW_OK(p)) return ($('#aerr').textContent = '영문과 숫자를 모두 넣어 8자 이상으로 해 주세요.');
      if (p !== $('#a-new2').value) return ($('#aerr').textContent = '새 비밀번호가 서로 달라요.');
      const { error } = await sb.auth.updateUser({ password: p, current_password: cur });
      if (error) return ($('#aerr').textContent = authMsg(error));
      toast('비밀번호를 바꿨어요'); $('#pwf').reset();
    });
    $('#logoutBtn').onclick = async () => { await sb.auth.signOut(); await refreshMe(); toast('로그아웃했어요'); location.hash = '#home'; };
    $('#d-confirm').addEventListener('input', (e) => ($('#delBtn').disabled = e.target.value.trim() !== '탈퇴'));
    $('#delBtn').onclick = async () => {
      $('#delBtn').disabled = true; $('#delBtn').textContent = '지우는 중...';
      try {
        await api('/api/me', { method: 'DELETE' });                 // 1) PC 서버에 있는 내 데이터
        const { error } = await sb.rpc('delete_my_account');         // 2) Supabase 계정
        if (error) throw error;
        await sb.auth.signOut(); await refreshMe();
        $('#main').innerHTML = authShell('탈퇴했어요', '그동안 LORE를 써 주셔서 고마워요. 모든 기록을 지웠어요.', '<a class="btn block" href="#home">홈으로</a>');
      } catch (err) { $('#derr').textContent = `탈퇴하지 못했어요: ${authMsg(err)}`; $('#delBtn').textContent = '회원 탈퇴'; $('#delBtn').disabled = false; }
    };
  }
}

// ---------- 약관 ----------
function viewDoc(kind) {
  const D = {
    terms: ['이용약관', `
      <h3>1. 서비스</h3><p>LORE는 오리지널 AI 캐릭터와 1:1로 이야기를 나누는 개인 포트폴리오 서비스입니다. 운영자 한 사람이 개인 PC에서 AI 모델을 돌려 운영하며, 돈을 받지 않습니다.</p>
      <h3>2. 회원</h3><p>만 14세 이상만 가입할 수 있습니다. 이용 한도를 피하려고 여러 계정을 만드는 것은 금지합니다.</p>
      <h3>3. 이용 한도</h3><p>PC 한 대로 운영하므로 회원마다 하루 대화 횟수와 1분당 전송 횟수에 한도가 있습니다. 운영자의 PC가 꺼져 있으면 서비스를 이용할 수 없습니다.</p>
      <h3>4. 금지 행위</h3><p>성적이거나 폭력적인 내용, 실존 인물을 비방하거나 흉내 내는 캐릭터, 다른 작품의 캐릭터를 그대로 가져온 캐릭터, 남의 그림을 허락 없이 올리는 것은 금지합니다. 어기면 알리지 않고 캐릭터나 계정을 지울 수 있습니다.</p>
      <h3>5. AI 답변</h3><p>캐릭터의 답은 AI가 만든 허구이며 사실과 다를 수 있습니다. 의료·법률·금융 판단에 쓰지 마세요.</p>
      <h3>6. 서비스 변경·종료</h3><p>개인 프로젝트이므로 미리 알린 뒤 서비스를 바꾸거나 끝낼 수 있습니다.</p>`],
    privacy: ['개인정보 처리방침', `
      <h3>모으는 정보</h3><p>이메일, 비밀번호(암호화되어 Supabase에 저장되며 운영자도 볼 수 없음), 닉네임, 태어난 해, 캐릭터가 부를 이름, 한 줄 소개, 소식 수신 여부.</p>
      <h3>대화 기록</h3><p>캐릭터와 나눈 대화, 찜, 내가 만든 캐릭터는 운영자 PC의 데이터베이스에 저장됩니다. AI 모델도 같은 PC에서 돌아가므로 대화를 외부 AI 회사로 보내지 않습니다. 운영자는 장애 확인을 위해 기록을 볼 수 있으니 <b>실명, 연락처, 주소 같은 개인정보는 대화에 적지 마세요.</b></p>
      <h3>이용 목적</h3><p>로그인, 나이 확인, 이용 한도 관리, 대화 기록 보관.</p>
      <h3>보관과 삭제</h3><p>회원 탈퇴 즉시 계정과 대화 기록, 찜, 만든 캐릭터를 모두 지웁니다. 마이페이지 → 계정에서 직접 탈퇴할 수 있습니다.</p>
      <h3>맡기는 곳</h3><p>회원 계정: Supabase(서울 지역). 접속 연결: Cloudflare.</p>`],
  };
  const [t, b] = D[kind];
  $('#main').innerHTML = `<div class="wrap doc" style="max-width:760px"><div class="page-h"><h1>${t}</h1><p>시행일 2026년 11월 20일</p></div>${b}</div>`;
}

// ---------- 공통: 로그인 상태 ----------
let sb = null, me = { member: false, admin: false };
async function authHeaders() {
  const h = { 'Content-Type': 'application/json' };
  if (sb) { const { data } = await sb.auth.getSession(); if (data.session) h.Authorization = `Bearer ${data.session.access_token}`; }
  return h;
}
async function refreshMe() {
  try { me = await api('/api/me'); } catch { me = { member: false, admin: false }; }
  renderUserbox();
  return me;
}
function renderUserbox() {
  const box = $('#userbox');
  if (me.member) box.innerHTML = `<a class="ubtn" href="#me" title="마이페이지"><span class="me-av sm">${esc((me.nickname || '?').slice(0, 1))}</span><span class="uname">${esc(me.nickname)}</span></a>`;
  else if (sb) box.innerHTML = `${me.admin ? '<span class="owner-badge" title="이 PC에서 직접 접속">PC 주인</span>' : ''}<a class="btn ghost" href="#login">로그인</a><a class="btn primary" href="#signup">회원가입</a>`;
  else box.innerHTML = me.admin ? '<span class="owner-badge">PC 주인</span>' : '';
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.classList.add('on'), 10); setTimeout(() => { t.classList.remove('on'); setTimeout(() => t.remove(), 300); }, 2600);
}
function bindEyes() {
  $$('[data-eye]').forEach((b) => b.addEventListener('click', () => {
    const i = $(`#${b.dataset.eye}`); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.textContent = show ? '숨기기' : '보기';
  }));
}
const canAct = () => me.member || me.admin;
async function initAuth() {
  await initBase();
  try {
    const cfg = await api('/api/config');
    if (cfg.auth && window.supabase) {
      sb = window.supabase.createClient(cfg.supabase_url, cfg.supabase_anon_key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
      sb.auth.onAuthStateChange((ev) => {
        if (ev === 'PASSWORD_RECOVERY') location.hash = '#reset';
        else if (ev === 'SIGNED_OUT' || ev === 'TOKEN_REFRESHED') refreshMe();
      });
      await sb.auth.getSession();
    }
  } catch (e) { console.warn('auth init', e); }
  await refreshMe();
}

// ---------- 라우팅 ----------
$('#searchForm').addEventListener('submit', (e) => { e.preventDefault(); const q = $('#q').value.trim(); location.hash = q ? `#search-${encodeURIComponent(q)}` : '#home'; });
async function route() {
  clearInterval(statusTimer); clearInterval(heroTimer);
  const h = decodeURIComponent(location.hash.slice(1)) || 'home';
  const nav = h.startsWith('chat') ? 'chats' : h.startsWith('ranking') ? 'ranking' : h;
  $$('[data-nav]').forEach((a) => (a.dataset.nav === nav ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
  if (!h.startsWith('search-')) $('#q').value = '';
  try {
    if (h.startsWith('chat-')) await viewChat(h.slice(5));
    else if (h.startsWith('c-')) await viewDetail(h.slice(2));
    else if (h.startsWith('ranking')) await viewRanking(h.split('-')[1] || 'day');
    else if (h.startsWith('tag-')) await viewList({ tag: h.slice(4) === '전체' ? null : h.slice(4) });
    else if (h.startsWith('search-')) await viewList({ q: h.slice(7) });
    else if (h === 'chats') await viewChats();
    else if (h === 'login') viewLogin();
    else if (h === 'signup') viewSignup();
    else if (h === 'forgot') viewForgot();
    else if (h === 'reset') viewReset();
    else if (h === 'me' || h.startsWith('me-')) await viewMe(h.slice(3) || 'profile');
    else if (h === 'terms' || h === 'privacy') viewDoc(h);
    else if (h === 'create') viewCreate();
    else if (h === 'status') await viewStatus();
    else await viewHome();
    if (!h.startsWith('chat-')) scrollTo(0, 0);
  } catch (e) {
    $('#main').innerHTML = `<div class="wrap"><div class="page-h"><h1>열 수 없어요</h1><p>${esc(e.message)}</p></div><p><a class="btn" href="#home">처음으로</a></p></div>`;
  }
}
addEventListener('hashchange', route);
// 비밀번호 재설정 링크로 돌아오면 주소 뒤에 #access_token=...이 붙는다. 그건 화면 주소가 아니다.
initAuth().then(() => { if (/access_token=|error_description=/.test(location.hash)) history.replaceState(null, '', location.pathname + '#home'); route(); });
</script>
